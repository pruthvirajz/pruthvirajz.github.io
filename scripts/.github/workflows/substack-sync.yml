name: Sync Substack posts to Blog

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new posts from Substack
        run: python scripts/update_blog.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "substack-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add new Substack post(s) to Blog"
          git push
