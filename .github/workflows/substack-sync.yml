name: Sync Substack posts to Blog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_blog.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "substack-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add new Substack post(s) to Blog"
          git push
